<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园充电桩 · 数据看板</title>
<style>
  :root { --bg:#f3f5f9; --card:#fff; --text:#0f172a; --muted:#475569; --line:#e2e8f0;
          --green:#047857; --amber:#b45309; --red:#dc2626; --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.06); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12.5px; margin-bottom:14px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:var(--card); border-radius:14px; padding:12px 8px; text-align:center; box-shadow:var(--shadow); }
  .stat .n { font-size:22px; font-weight:700; }
  .stat .l { font-size:11.5px; color:var(--muted); }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  input,select,button { min-height:42px; border:1px solid var(--line); border-radius:10px;
                        background:var(--card); padding:8px 12px; font-size:14px; }
  button.primary { background:var(--green); color:#fff; border-color:var(--green); cursor:pointer; }
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:14px 16px; margin-bottom:10px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .name { font-weight:600; }
  .meta { color:var(--muted); font-size:12px; margin-top:3px; }
  .big { font-size:24px; font-weight:700; color:var(--green); }
  .big.zero { color:var(--red); }
  .bar { height:6px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:8px; }
  .bar i { display:block; height:100%; background:var(--green); }
  .muted { color:var(--muted); font-size:12px; }
  .modal { position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:center; justify-content:center; padding:16px; }
  .modal.show { display:flex; }
  .modal .box { background:#fff; border-radius:16px; padding:16px; width:100%; max-width:640px; max-height:86vh; overflow:auto; }
  .tabs { display:flex; gap:8px; margin:0 0 12px; }
  .tab { flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px;
         min-height:40px; cursor:pointer; font-size:14px; }
  .tab.on { background:var(--green); color:#fff; border-color:var(--green); }
  .heat { display:grid; grid-template-columns:repeat(24,1fr); gap:2px; margin-top:8px; }
  .heat i { aspect-ratio:1; border-radius:3px; background:#e2e8f0; display:block; }
  .rank-row { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .rank-row:last-child { border-bottom:0; }
  svg { width:100%; height:220px; display:block; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>校园充电桩 · 数据看板</h1>
  <div class="sub" id="sub">加载中…</div>
  <div class="tabs"><button class="tab on" id="tabLive">实时</button><button class="tab" id="tabAnalysis">分析</button></div>

  <div class="stats live-only">
    <div class="stat"><div class="n" id="sIdle">–</div><div class="l">空闲</div></div>
    <div class="stat"><div class="n" id="sCharging">–</div><div class="l">充电中</div></div>
    <div class="stat"><div class="n" id="sFault">–</div><div class="l">故障</div></div>
    <div class="stat"><div class="n" id="sUploads">–</div><div class="l">累计上传</div></div>
  </div>

  <div class="toolbar live-only">
    <input id="q" placeholder="搜索楼栋" style="flex:1 1 160px">
    <select id="sort"><option value="idle">空闲多</option><option value="name">名称</option></select>
    <button class="primary" id="reload">刷新</button>
  </div>

  <div id="list" class="live-only"><div class="empty">加载中…</div></div>

  <div id="analysis" style="display:none">
    <div class="card"><div class="row"><b>工作日 vs 周末</b><span class="muted" id="ww"></span></div></div>
    <div class="card"><b>24 小时趋势</b><svg id="t24" viewBox="0 0 600 160" preserveAspectRatio="none"></svg></div>
    <div class="card"><b>7 天趋势</b><svg id="t7" viewBox="0 0 600 160" preserveAspectRatio="none"></svg></div>
    <div class="card"><b>时段热力图</b><div class="muted">行=周一…周日，列=0–23 点；颜色越绿空闲率越高</div><div id="heat" class="heat"></div></div>
    <div class="card"><b>区域排行</b><div id="rank"></div></div>
    <div class="card"><b>未来 1 小时预测（同星期同时段均值）</b><div id="forecast"></div></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <div class="row"><b id="mTitle">历史</b><button id="mClose">关闭</button></div>
    <div class="muted" id="mSub"></div>
    <svg id="chart" viewBox="0 0 600 220" preserveAspectRatio="none"></svg>
    <div class="muted" id="mFooter"></div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let data = null, q = '', sort = 'idle';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = (v) => Number.isFinite(Number(v)) ? Number(v) : 0;

  async function load() {
    try {
      const r = await fetch('/api/overview', {cache: 'no-store'});
      data = await r.json();
      render();
    } catch (e) {
      $('sub').textContent = '加载失败：' + e.message;
    }
  }

  function render() {
    if (!data) return;
    const snap = data.snapshot || {};
    const areas = snap.areas || [];
    const sum = areas.reduce((s, a) => {
      s.idle += num(a.idle_port); s.charging += num(a.charging_port);
      s.fault += num(a.fault_port); s.total += num(a.total_port); return s;
    }, {idle:0,charging:0,fault:0,total:0});
    $('sIdle').textContent = sum.idle;
    $('sCharging').textContent = sum.charging;
    $('sFault').textContent = sum.fault;
    $('sUploads').textContent = data.uploads || 0;
    $('sub').textContent = '最近上传 ' + (data.received_at || '—') + ' · 采集时间 ' + (snap.captured_at || '—');

    let list = areas.filter(a => String(a.name || '').toLowerCase().includes(q.toLowerCase()));
    if (sort === 'name') list.sort((a,b) => String(a.name).localeCompare(String(b.name), 'zh'));
    else list.sort((a,b) => num(b.idle_port) - num(a.idle_port));
    $('list').innerHTML = list.length ? list.map(a => {      const idle = num(a.idle_port), total = num(a.total_port);
      const pct = total ? Math.round(idle / total * 100) : 0;
      return `<div class="card" data-name="${esc(a.name)}">
        <div class="row"><div><div class="name">${esc(a.name)}</div>
        <div class="meta">充电中 ${num(a.charging_port)} · 故障 ${num(a.fault_port)}</div></div>
        <div class="big ${idle ? '' : 'zero'}">${idle}<span class="muted" style="font-size:12px"> / ${total}</span></div></div>
        <div class="bar"><i style="width:${pct}%"></i></div></div>`;
    }).join('') : '<div class="empty">' + (areas.length ? '没有匹配的数据' : '暂无数据，等 App 上传') + '</div>';
  }

  $('list').addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (card) showHistory(card.dataset.name);
  });
  $('q').addEventListener('input', (e) => { q = e.target.value.trim(); render(); });
  $('sort').addEventListener('change', (e) => { sort = e.target.value; render(); });
  $('reload').addEventListener('click', load);
  $('mClose').addEventListener('click', () => $('modal').classList.remove('show'));
  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) $('modal').classList.remove('show'); });

  let histSeq = 0;
  async function showHistory(name) {
    const my = ++histSeq;
    $('mTitle').textContent = name;
    $('modal').classList.add('show');
    $('mSub').textContent = '加载历史…';
    $('mFooter').textContent = '';
    $('chart').innerHTML = '';
    try {
      const r = await fetch('/api/history?limit=200&area=' + encodeURIComponent(name), {cache: 'no-store'});
      const d = await r.json();
      if (my !== histSeq) return;
      const rows = d.rows || [];
      if (!rows.length) { $('mSub').textContent = '还没有历史数据'; return; }
      const first = rows[0], last = rows[rows.length - 1];
      $('mSub').textContent = `${rows.length} 个采样 · ${first.t} → ${last.t}`;
      const W = 600, H = 220, P = 28;
      const maxTotal = Math.max(...rows.map(r => num(r.total))) || 1;
      const pts = rows.map((r, i) => {
        const x = P + (W - 2*P) * i / Math.max(1, rows.length - 1);
        const y = H - P - (H - 2*P) * num(r.idle) / maxTotal;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      $('chart').innerHTML =
        `<polyline fill="none" stroke="#047857" stroke-width="2" points="${pts.join(' ')}"/>` +
        `<line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#e2e8f0"/>` +
        `<text x="4" y="${P}" font-size="10" fill="#475569">空闲</text>`;
      $('mFooter').textContent = `当前空闲 ${num(last.idle)} / ${num(last.total)}，峰值 ${Math.max(...rows.map(r => num(r.idle)))}`;
    } catch (e) {
      $('mSub').textContent = '加载失败：' + e.message;
    }
  }

  const tabLive = $('tabLive'), tabA = $('tabAnalysis'), analysis = $('analysis');
  let analysisLoaded = false;
  function showTab(isAnalysis) {
    tabLive.classList.toggle('on', !isAnalysis);
    tabA.classList.toggle('on', isAnalysis);
    analysis.style.display = isAnalysis ? '' : 'none';
    document.querySelectorAll('.live-only').forEach(el => {
      el.style.display = isAnalysis ? 'none' : '';
    });
    if (isAnalysis && !analysisLoaded) { analysisLoaded = true; loadAnalytics(); }
  }
  tabLive.addEventListener('click', () => showTab(false));
  tabA.addEventListener('click', () => showTab(true));

  function spark(el, rows) {
    const W = 600, H = 160, P = 24;
    if (!rows || rows.length < 2) { el.innerHTML = ''; return; }
    const pts = rows.map((r, i) => {
      const x = P + (W - 2 * P) * i / (rows.length - 1);
      const y = H - P - (H - 2 * P) * Math.min(1, Math.max(0, r.ratio));
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    el.innerHTML = '<polyline fill="none" stroke="#047857" stroke-width="2" points="'
      + pts.join(' ') + '"/><line x1="' + P + '" y1="' + (H - P) + '" x2="' + (W - P)
      + '" y2="' + (H - P) + '" stroke="#e2e8f0"/>';
  }

  function renderHeat(heat) {
    const names = ['一', '二', '三', '四', '五', '六', '日'];
    let html = '';
    for (let d = 0; d < 7; d++) {
      for (let h = 0; h < 24; h++) {
        const v = heat[d] && heat[d][h];
        const alpha = v == null ? 0 : 0.15 + 0.75 * Math.min(1, Math.max(0, v));
        html += '<i title="周' + names[d] + ' ' + h + '点 ' 
          + (v == null ? '无数据' : Math.round(v * 100) + '%') + '" style="background:rgba(4,120,87,'
          + alpha.toFixed(2) + ')"></i>';
      }
    }
    $('heat').innerHTML = html;
  }

  async function loadAnalytics() {
    try {
      const r = await fetch('/api/analytics?weeks=8', { cache: 'no-store' });
      const d = await r.json();
      const ww = d.weekday_weekend || {};
      $('ww').textContent = '工作日 ' + (ww.weekday == null ? '—' : Math.round(ww.weekday * 100) + '%')
        + ' · 周末 ' + (ww.weekend == null ? '—' : Math.round(ww.weekend * 100) + '%');
      spark($('t24'), d.trend_24h);
      spark($('t7'), d.trend_7d);
      renderHeat(d.heatmap);
      $('rank').innerHTML = (d.ranking || []).slice(0, 10).map(x =>
        '<div class="rank-row"><span>' + esc(x.name) + '</span><span>平均空闲 '
        + Math.round(x.avg_idle_ratio * 100) + '% · 故障 ' + Math.round(x.avg_fault_ratio * 100) + '%</span></div>'
      ).join('') || '<div class="muted">样本不足</div>';
      $('forecast').innerHTML = (d.forecast || []).slice(0, 10).map(x =>
        '<div class="rank-row"><span>' + esc(x.name) + '</span><span>预计空闲 '
        + x.predicted_idle + ' / ' + x.total + '</span></div>'
      ).join('') || '<div class="muted">样本不足</div>';
    } catch (e) {
      analysisLoaded = false;
      $('ww').textContent = '加载失败：' + e.message;
    }
  }

  load();
})();
</script>
</body>
</html>
