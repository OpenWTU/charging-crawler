[tool.ruff]
# 目标版本与 CI 矩阵下限保持一致
target-version = "py310"
line-length = 110
exclude = [
  ".git",
  "__pycache__",
  "webui",
  "android",
  "cloud/web",
  "cloud/data",
]

[tool.ruff.lint]
# 只开「语法错误 + 未定义名 + 明显 bug」这类低争议规则，
# 避免把既有代码风格（行长、引号、导入顺序）当成错误。
select = ["E4", "E7", "E9", "F"]
ignore = [
  "E731",  # 允许 lambda 赋值（配置类代码常见）
  "F401",  # 允许 __init__ / 门面里的再导出
]

[tool.ruff.lint.per-file-ignores]
"cloud/app.py" = ["F401", "F403"]
"cloud/http/__init__.py" = ["F401"]
"tests/*" = ["F841"]  # 测试里允许构造后不用的局部变量
