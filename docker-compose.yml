# charging-crawler 一键部署
#
# 新节点：
#   docker compose pull && docker compose up -d
# 构建本地镜像（开发）：
#   docker compose build
#
# 数据挂载：./data 由部署机决定（服务器上指向 /var/lib/charge-cloud 复用现有数据）
# 前端已打进镜像（与后端同 tag 发布），节点间不会前端版本不一致。

services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ghcr.io/openwtu/charging-crawler:latest
    container_name: charge-node
    restart: unless-stopped
    # 以 www-data（uid 33）运行：复用 /var/lib/charge-cloud 的数据时才有写权限
    user: "33:33"
    ports:
      - "127.0.0.1:8791:8791"   # HTTP，仅绑本机，由 Nginx 反代
      - "4001:4001"             # libp2p（P2P_ENABLED=true 时用）
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      HOST: 0.0.0.0
      PORT: "8791"
      DATABASE_PATH: /data/charge.db
      DATABASE_READONLY: "false"
      AUTO_WORKER: "true"
      TOKEN_KEY_FILE: /data/token_key
      VERSION_FILE: /data/version.json
      APK_DIR: /data/download
      WEB_DIST: /web
      P2P_ENABLED: ${P2P_ENABLED:-true}
      P2P_LISTEN_PORT: "4001"
      P2P_BOOTSTRAP: ${P2P_BOOTSTRAP:-}
      P2P_KEY_FILE: /data/p2p_key
      P2P_WHITELIST_CACHE: /data/p2p_peers.json
      P2P_MDNS: "false"
      NODE_NAME: ${NODE_NAME:-主节点}
    volumes:
      # 时区：让容器内 nowStr() 等用北京时间（宿主已配 Asia/Shanghai）
      - /etc/localtime:/etc/localtime:ro
      # 数据目录：SQLite 库 + token_key + version.json + download + p2p_key
      - ${DATA_DIR:-./data}:/data
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
