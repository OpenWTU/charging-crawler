# charge-node 节点部署模板（install.sh 会下载这个文件到 /opt/charge-node/docker-compose.yml）
#
# 纯镜像部署，不需要源码/构建。环境变量由 install.sh 或 .env 提供：
#   DATA_DIR / NODE_NAME / NODE_URL / NODE_P2P_ADDR

services:
  app:
    image: ghcr.io/openwtu/charging-crawler:latest
    container_name: charge-node
    restart: unless-stopped
    user: "33:33"
    ports:
      - "8791:8791"
      - "4001:4001"
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      HOST: 0.0.0.0
      PORT: "8791"
      DATABASE_PATH: /data/charge.db
      DATABASE_READONLY: "false"
      AUTO_WORKER: "true"
      TOKEN_KEY_FILE: /data/token_key
      VERSION_FILE: /data/version.json
      APK_DIR: /data/download
      WEB_DIST: /web
      P2P_ENABLED: ${P2P_ENABLED:-true}
      P2P_LISTEN_PORT: "4001"
      P2P_KEY_FILE: /data/p2p_key
      P2P_WHITELIST_CACHE: /data/p2p_peers.json
      P2P_MDNS: "false"
      NODE_NAME: ${NODE_NAME:-charge-node}
      NODE_URL: ${NODE_URL:-}
      NODE_P2P_ADDR: ${NODE_P2P_ADDR:-}
      # 前面有 Nginx 时设 true（只信任本机/docker 网段转发的 XFF）
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_DIR:-/var/lib/charge-cloud}:/data
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
