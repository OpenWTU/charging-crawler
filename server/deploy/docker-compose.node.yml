# charge-node 节点部署模板（install.sh 会下载这个文件到 /opt/charge-node/docker-compose.yml）
#
# 纯镜像部署，不需要源码/构建。环境变量由 install.sh 或 .env 提供：
#   DATA_DIR / NODE_NAME / NODE_URL / NODE_P2P_ADDR

services:
  app:
    image: ghcr.io/openwtu/charging-crawler:latest
    container_name: charge-node
    restart: unless-stopped
    user: "33:33"
    ports:
      - "8791:8791"
      - "4001:4001"
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      HOST: 0.0.0.0
      PORT: "8791"
      DATABASE_PATH: /data/charge.db
      DATABASE_READONLY: "false"
      AUTO_WORKER: "true"
      TOKEN_KEY_FILE: /data/token_key
      VERSION_FILE: /data/version.json
      APK_DIR: /data/download
      WEB_DIST: /web
      P2P_ENABLED: ${P2P_ENABLED:-true}
      P2P_LISTEN_PORT: "4001"
      P2P_KEY_FILE: /data/p2p_key
      P2P_WHITELIST_CACHE: /data/p2p_peers.json
      P2P_MDNS: "false"
      NODE_NAME: ${NODE_NAME:-charge-node}
      NODE_URL: ${NODE_URL:-}
      NODE_P2P_ADDR: ${NODE_P2P_ADDR:-}
      # 前面有 Nginx 时设 true（只信任本机/docker 网段转发的 XFF）
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # 管理后台：首次启动时若 admin_users 为空，用这个口令建 admin 账号（建完就没用了）
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-}
      # 会话签名密钥：不设则每次重启随机生成 → 所有管理员会话失效
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      # 设备注册令牌：配置后，未带 x-register-token 的注册请求**不入库**、
      # 但对外仍返回成功（兼容不带该头的旧版 App）。不入库的设备上传时因为
      # 查不到 secret_enc 会 401，所以野生设备写不进数据。
      # 默认值与 App 内置的 REGISTER_TOKEN 一致（Cloud.java），换值需两边同步。
      REGISTER_TOKEN: ${REGISTER_TOKEN:-chg-reg-7f3a9c21e5d84b06}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_DIR:-/var/lib/charge-cloud}:/data
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
