name: release-apk

on:
  push:
    tags: ['v*']
  # 手动触发：GitHub 的 tag push 事件偶发不投递（2026-11-09 实测 v2.4.24/25/28 都没触发，
  # 而 v2.4.26/27 正常），这里给一条不依赖该事件的发版通道。
  # 用法：Actions → release-apk → Run workflow → 填 tag（如 v2.4.28）。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v2.4.28）。留空则用当前 ref'
        required: false
        type: string

permissions:
  contents: write

jobs:
  apk:
    name: build apk & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 设置 ANDROID_HOME
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          mkdir -p "$HOME/android-sdk/cmdline-tools"

      - name: 下载 Android cmdline-tools
        run: |
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/clt.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"

      - name: 安装 Android SDK 组件
        run: |
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: 构建前端（build.py 需要 webui/dist）
        working-directory: webui
        run: |
          pnpm install --frozen-lockfile=false
          pnpm run build

      - name: 准备签名密钥（从 Secrets 恢复到临时目录）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p /tmp/charge-secrets
          echo "$KEYSTORE_B64" | base64 -d > /tmp/charge-secrets/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" > /tmp/charge-secrets/keystore.properties

      - name: 计算 versionCode/versionName（从 tag 派生）
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          echo "发布 ref: $REF"
          CODE=$(python3 -c "import re,sys; m=re.match(r'v(\d+)\.(\d+)\.(\d+)', sys.argv[1]); print(int(m.group(1))*1000000 + int(m.group(2))*1000 + int(m.group(3)))" "$REF")
          NAME=$(echo "$REF" | sed 's/^v//')
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "versionCode=$CODE versionName=$NAME"

      - name: 构建 APK
        env:
          CHARGE_ANDROID_SDK: ${{ env.ANDROID_HOME }}
          CHARGE_JAVA_HOME: ${{ env.JAVA_HOME }}
          CHARGE_SECRETS_DIR: /tmp/charge-secrets
          CHARGE_VERSION_NAME: ${{ env.VERSION_NAME }}
          CHARGE_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          set -x  # M-diagnose：失败时能看到完整命令与环境
          echo "ANDROID_HOME=$CHARGE_ANDROID_SDK"
          echo "JAVA_HOME=$CHARGE_JAVA_HOME"
          python3 --version
          ls "$CHARGE_ANDROID_SDK/build-tools/" || true
          ls "$CHARGE_ANDROID_SDK/platforms/" || true
          ls "$CHARGE_JAVA_HOME/bin/javac" || true
          python3 android/build.py --no-version-json --allow-stale-web

      - name: 校验 APK 产物
        run: |
          ls -lh android/build/app-debug.apk
          sha256sum android/build/app-debug.apk

      - name: 生成 version.json（供服务器自动同步）
        run: |
          SHA=$(sha256sum android/build/app-debug.apk | cut -d' ' -f1)
          SIZE=$(du -h android/build/app-debug.apk | cut -f1)
          python3 - "$VERSION_CODE" "$VERSION_NAME" "$SHA" "$SIZE" <<'PY'
          import json, subprocess, sys
          code, name, sha, size = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          # 更新说明：只取提交信息里「有价值的短句」，别把整篇 commit body 塞进去
          # （之前把 "## 症状 / 根因 / ```java ..." 全部当 changelog，App 弹窗里一屏都是代码块）
          try:
              subject = subprocess.check_output(
                  ["git", "log", "-1", "--format=%s"], text=True, encoding="utf-8"
              ).strip()
              body = subprocess.check_output(
                  ["git", "log", "-1", "--format=%b"], text=True, encoding="utf-8"
              ).strip()
              lines = []
              if subject:
                  lines.append(subject)
              # 正文只挑以 "- " 开头的要点行，最多 5 条，且跳过代码块/标题/表格式行
              for raw in body.split("\n"):
                  s = raw.strip()
                  if not s.startswith("- ") or len(s) < 4:
                      continue
                  if "```" in s or s.startswith("- #"):
                      continue
                  lines.append(s[2:].strip()[:80])
                  if len(lines) >= 6:
                      break
              changelog = lines
          except Exception:
              changelog = []
          d = {
              "versionCode": int(code),
              "versionName": name,
              "apkPath": "/download/app-debug.apk?v=" + code,
              "sizeText": size,
              "sha256": sha,
              "releasedAt": subprocess.check_output(["date", "+%Y-%m-%d %H:%M"], text=True, encoding="utf-8").strip(),
              "changelog": changelog,
          }
          open("version.json", "w", encoding="utf-8").write(json.dumps(d, ensure_ascii=False, indent=2))
          print("changelog:", changelog)
          PY
          cat version.json

      - name: 发布 Release（上传 APK + version.json）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/build/app-debug.apk
            version.json
          generate_release_notes: true

      # 把 version.json 也放进仓库，供 jsDelivr 走 CDN（App 在服务器不可达时取它）。
      # 放在 Release 之后 + continue-on-error：发版是主线，这一步只是锦上添花，
      # 绝不能因为它失败而让 APK/Release 发不出去（v2.4.26 就是踩了这个坑）。
      # 用 REST API 提交而不是 git checkout/commit：tag 构建是 detached HEAD + 浅克隆，
      # 改工作区容易出问题。
      - name: 同步 deploy/version.json 到 main（失败不影响发版）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 完全显式：curl + jq，不依赖 gh CLI 的隐式行为，并开 set -x 便于排查。
          set -x
          set -o pipefail

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/deploy/version.json"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          ACC="Accept: application/vnd.github+json"

          echo "--- 1) 取现有文件 sha（不存在则 404，正常）---"
          RESP=$(curl -sS -w '\n%{http_code}' -H "$AUTH" -H "$ACC" "$API" || true)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          CODE=$(printf '%s' "$RESP" | tail -n1)
          echo "HTTP=$CODE"
          SHA=""
          if [ "$CODE" = "200" ]; then
            SHA=$(printf '%s' "$BODY" | jq -r '.sha // empty')
          fi
          echo "existing sha=${SHA:-（无）}"

          echo "--- 2) 构造请求体 ---"
          B64=$(base64 -w 0 version.json)
          echo "base64 长度=${#B64}"
          if [ -n "$SHA" ]; then
            PAYLOAD=$(jq -n --arg m "chore(release): 同步 deploy/version.json [skip ci]" \
                              --arg c "$B64" --arg s "$SHA" \
                              '{message:$m, content:$c, branch:"main", sha:$s}')
          else
            PAYLOAD=$(jq -n --arg m "chore(release): 同步 deploy/version.json [skip ci]" \
                              --arg c "$B64" \
                              '{message:$m, content:$c, branch:"main"}')
          fi

          echo "--- 3) PUT 提交 ---"
          OUT=$(curl -sS -w '\n%{http_code}' -X PUT \
            -H "$AUTH" -H "$ACC" -H "Content-Type: application/json" \
            --data "$PAYLOAD" "$API" || true)
          OUT_CODE=$(printf '%s' "$OUT" | tail -n1)
          echo "PUT HTTP=$OUT_CODE"
          printf '%s' "$OUT" | sed '$d' | head -c 600
          echo

          if [ "$OUT_CODE" != "200" ] && [ "$OUT_CODE" != "201" ]; then
            echo "::error::同步 deploy/version.json 失败（HTTP $OUT_CODE）"
            exit 1
          fi
          echo "deploy/version.json 已同步"
