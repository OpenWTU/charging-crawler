name: release-apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: build apk & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: 构建前端（build.py 需要 cloud/web/dist）
        working-directory: webui
        run: |
          pnpm install --frozen-lockfile=false
          pnpm run build

      - name: 准备签名密钥（从 Secrets 恢复到临时目录）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p /tmp/charge-secrets
          echo "$KEYSTORE_B64" | base64 -d > /tmp/charge-secrets/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" > /tmp/charge-secrets/keystore.properties

      - name: 构建 APK
        env:
          CHARGE_ANDROID_SDK: ${{ env.ANDROID_HOME }}
          CHARGE_JAVA_HOME: ${{ env.JAVA_HOME }}
          CHARGE_SECRETS_DIR: /tmp/charge-secrets
          CHARGE_VERSION_NAME: ${{ github.ref_name }}
          # versionCode 从 tag 派生（v1.11.40 -> 11140），保证递增
          CHARGE_VERSION_CODE: ${{ github.run_number }}
        run: python3 android/build.py --no-version-json

      - name: 校验 APK 产物
        run: |
          ls -lh android/build/app-debug.apk
          sha256sum android/build/app-debug.apk

      - name: 发布 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          files: android/build/app-debug.apk
          generate_release_notes: true
