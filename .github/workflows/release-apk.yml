name: release-apk

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: build apk & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 设置 ANDROID_HOME
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          mkdir -p "$HOME/android-sdk/cmdline-tools"

      - name: 下载 Android cmdline-tools
        run: |
          curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/clt.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"

      - name: 安装 Android SDK 组件
        run: |
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: 构建前端（build.py 需要 webui/dist）
        working-directory: webui
        run: |
          pnpm install --frozen-lockfile=false
          pnpm run build

      - name: 准备签名密钥（从 Secrets 恢复到临时目录）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p /tmp/charge-secrets
          echo "$KEYSTORE_B64" | base64 -d > /tmp/charge-secrets/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" > /tmp/charge-secrets/keystore.properties

      - name: 计算 versionCode/versionName（从 tag 派生）
        run: |
          CODE=$(python3 -c "import re,sys; m=re.match(r'v(\d+)\.(\d+)\.(\d+)', sys.argv[1]); print(int(m.group(1))*1000000 + int(m.group(2))*1000 + int(m.group(3)))" "${{ github.ref_name }}")
          NAME=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "versionCode=$CODE versionName=$NAME"

      - name: 构建 APK
        env:
          CHARGE_ANDROID_SDK: ${{ env.ANDROID_HOME }}
          CHARGE_JAVA_HOME: ${{ env.JAVA_HOME }}
          CHARGE_SECRETS_DIR: /tmp/charge-secrets
          CHARGE_VERSION_NAME: ${{ env.VERSION_NAME }}
          CHARGE_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: python3 android/build.py --no-version-json

      - name: 校验 APK 产物
        run: |
          ls -lh android/build/app-debug.apk
          sha256sum android/build/app-debug.apk

      - name: 生成 version.json（供服务器自动同步）
        run: |
          SHA=$(sha256sum android/build/app-debug.apk | cut -d' ' -f1)
          SIZE=$(du -h android/build/app-debug.apk | cut -f1)
          python3 - "$VERSION_CODE" "$VERSION_NAME" "$SHA" "$SIZE" <<'PY'
          import json, subprocess, sys
          code, name, sha, size = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          # 更新说明：取本 tag 的提交信息（去掉空行）
          try:
              raw = subprocess.check_output(["git", "log", "-1", "--format=%B"], text=True)
              changelog = [l.strip() for l in raw.strip().split("\n") if l.strip()]
          except Exception:
              changelog = []
          d = {
              "versionCode": int(code),
              "versionName": name,
              "apkPath": "/download/app-debug.apk?v=" + code,
              "sizeText": size,
              "sha256": sha,
              "releasedAt": subprocess.check_output(["date", "+%Y-%m-%d %H:%M"]).decode().strip(),
              "changelog": changelog,
          }
          open("version.json", "w", encoding="utf-8").write(json.dumps(d, ensure_ascii=False, indent=2))
          print("changelog:", changelog)
          PY
          cat version.json

      - name: 发布 Release（上传 APK + version.json）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/build/app-debug.apk
            version.json
          generate_release_notes: true
