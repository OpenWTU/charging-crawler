name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送会取消上一次未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: node & vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          # node:sqlite 在 Node 24 才正式，低版本需要 --experimental-sqlite
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile=false

      - name: 类型检查
        run: pnpm run typecheck

      - name: 单元测试
        run: pnpm run test

      - name: 构建
        run: pnpm run build

  web:
    name: web build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: webui
        run: pnpm install --frozen-lockfile=false

      - name: ESLint
        working-directory: webui
        run: pnpm run lint

      - name: 构建
        working-directory: webui
        run: pnpm run build

  android:
    name: android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      # M10：CI 原来完全没有 Android job —— Java 编译错误、manifest 破坏、
      # build.py 的版本号逻辑都只能等到打 tag（或真机）才暴露。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建 web 产物（APK 会把它拷进 assets/www）
        working-directory: webui
        run: |
          pnpm install --frozen-lockfile=false
          pnpm run build

      - name: 编译 APK（--no-version-json，不写 version_clean.json）
        env:
          # 关键：CI 的 SDK/JDK 在 ubuntu 的路径，build.py 靠这两个变量定位
          # （不传就会回落到 Windows 默认值 C:\Android\sdk → 一定失败）
          CHARGE_ANDROID_SDK: ${{ env.ANDROID_HOME }}
          CHARGE_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -x  # M-diagnose：失败时能看到完整命令与环境
          echo "ANDROID_HOME=$CHARGE_ANDROID_SDK"
          echo "JAVA_HOME=$CHARGE_JAVA_HOME"
          python3 --version
          ls "$CHARGE_ANDROID_SDK/build-tools/" || true
          ls "$CHARGE_ANDROID_SDK/platforms/" || true
          ls "$CHARGE_JAVA_HOME/bin/javac" || true
          python3 android/build.py --no-version-json --allow-stale-web

      - name: 编译并运行 Java 单元测试（Packets/Sign 向量）
        run: |
          SDK="$ANDROID_HOME"
          API=$(ls "$SDK/platforms" | sort -V | tail -1)
          javac -cp "$SDK/platforms/$API/android.jar" -d /tmp/jt \
            android/test/com/test19124/charging/*.java \
            android/app/src/main/java/com/test19124/charging/*.java 2>&1 | head -40
          echo "javac 完成（$API）"
