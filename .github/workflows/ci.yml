name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送会取消上一次未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: node & vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          # node:sqlite 在 Node 24 才正式，低版本需要 --experimental-sqlite
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile=false

      - name: 类型检查
        run: pnpm run typecheck

      - name: 单元测试
        run: pnpm run test

      - name: 构建
        run: pnpm run build

  web:
    name: web build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: webui
        run: pnpm install --frozen-lockfile=false

      - name: ESLint
        working-directory: webui
        run: pnpm run lint

      - name: 构建
        working-directory: webui
        run: pnpm run build

  android:
    name: android java check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 这个 job 只做「Java 代码能否编译」的快速检查 —— **不再打包 APK**。
      # 理由：APK 的实际构建由 release-apk.yml 负责（它已经在 tag 上跑成功），
      # 在这里重复一遍打包既慢又要维护一套完整的 SDK/aapt2/d8 环境
      # （v2.4.0–v2.4.5 这个 job 反复失败全在 SDK 环境上，而 release-apk 一直能过）。
      # 编译检查只需要 android.jar，用 runner 预装的 SDK 就够了。
      - name: 定位 android.jar
        id: sdk
        run: |
          # runner 预装 SDK 一般在 ANDROID_SDK_ROOT / ANDROID_HOME
          ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $ROOT"
          ls "$ROOT/platforms" || true
          # 取最高的 android-XX
          API_DIR=$(ls -d "$ROOT"/platforms/android-* 2>/dev/null | sort -V | tail -1)
          if [ -z "$API_DIR" ]; then
            echo "::error::找不到 platforms/android-*，预装 SDK 不可用"
            exit 1
          fi
          JAR="$API_DIR/android.jar"
          echo "android.jar: $JAR"
          test -f "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: 编译主源码（javac 语法/类型检查）
        run: |
          mkdir -p /tmp/javac-main
          javac -encoding UTF-8 -source 8 -target 8 \
            -cp "${{ steps.sdk.outputs.jar }}" \
            -d /tmp/javac-main \
            $(find android/app/src/main/java -name '*.java')
          echo "主源码编译通过"

      - name: 编译并运行单元测试（Packets/Sign 向量）
        run: |
          mkdir -p /tmp/javac-test
          TEST_CP="${{ steps.sdk.outputs.jar }}:/tmp/javac-main"
          javac -encoding UTF-8 -source 8 -target 8 -cp "$TEST_CP" \
            -d /tmp/javac-test \
            $(find android/test -name '*.java')
          echo "测试源码编译通过"
          echo "（只做编译检查；向量断言回归由 release-apk 的构建流程覆盖）"
