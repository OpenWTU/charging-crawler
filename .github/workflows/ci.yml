name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送会取消上一次未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: node & vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          # node:sqlite 在 Node 24 才正式，低版本需要 --experimental-sqlite
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile=false

      - name: 类型检查
        run: pnpm run typecheck

      - name: 单元测试
        run: pnpm run test

      - name: 构建
        run: pnpm run build

  web:
    name: web build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: webui
        run: pnpm install --frozen-lockfile=false

      - name: ESLint
        working-directory: webui
        run: pnpm run lint

      - name: 构建
        working-directory: webui
        run: pnpm run build
