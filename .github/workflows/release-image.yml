name: release-image

on:
  push:
    tags: ['v*']
  # 同 release-apk：tag push 事件偶发不投递，留一条手动通道
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建镜像的 tag（如 v2.4.28）。留空则用当前 ref'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build & push docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          # is_latest 靠 git tag -l 排序判断，必须把 tag 拉全（默认 fetch-depth:1 没有 tag）
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      # 前端必须先构建：Dockerfile 会 COPY webui/dist
      - name: 构建前端（输出到 webui/dist）
        working-directory: webui
        run: |
          pnpm install --frozen-lockfile=false
          pnpm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # L9：原来任何 v* tag 都无条件打 :latest —— 发一个补丁版本时 latest 会被"回退"到旧代码，
      # 而生产 systemd timer 跟的就是 latest。这里先判断是不是最新 tag。
      - name: 判断是否为最新版本 tag
        id: latest
        run: |
          RELEASE_REF="${{ inputs.tag || github.ref_name }}"
          LATEST=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          echo "latest_tag=$LATEST  release_ref=$RELEASE_REF"
          if [ "$LATEST" = "$RELEASE_REF" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          build-args: |
            VERSION=${{ inputs.tag || github.ref_name }}
          tags: |
            ghcr.io/openwtu/charging-crawler:${{ inputs.tag || github.ref_name }}
            ${{ steps.latest.outputs.is_latest == 'true' && 'ghcr.io/openwtu/charging-crawler:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
