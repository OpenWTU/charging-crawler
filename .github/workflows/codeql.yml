name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 03:17 UTC 例行扫描
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
            # Python 版已下线，cloud/crawler/tests 是遗留代码，不分析
            paths-ignore: 'cloud/**,crawler/**,tests/**'
          - language: javascript-typescript
            build-mode: none
            paths-ignore: ''
    steps:
      - uses: actions/checkout@v7

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          paths-ignore: ${{ matrix.paths-ignore }}

      - name: 分析
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
