name: 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便？什么场景下会用到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 如果有实现思路也欢迎写出来
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - Android App
        - 前端页面
        - 管理后台
        - 服务端接口
        - 抓取 / 预测算法
        - 部署与运维
  - type: checkboxes
    id: compliance
    attributes:
      label: 合规确认
      options:
        - label: 该建议不涉及采集其他用户数据、调用运营商后台接口或设备控制
          required: true
